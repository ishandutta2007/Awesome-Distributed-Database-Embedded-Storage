<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.55; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
    }
    @keyframes pulseNode {
      0%, 100% { r: 6; opacity: 0.8; }
      50% { r: 9; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    @keyframes pulseData {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .pulse-orb1 { animation: pulseOrb 8s ease-in-out infinite; }
    .pulse-orb2 { animation: pulseOrb 10s ease-in-out infinite reverse; }
    .data-flow { stroke-dasharray: 8 6; animation: pulseData 6s linear infinite; }
    .node-pulse1 { animation: pulseNode 3s ease-in-out infinite; }
    .node-pulse2 { animation: pulseNode 3s ease-in-out infinite 1s; }
    .node-pulse3 { animation: pulseNode 3s ease-in-out infinite 2s; }
    .pill-group { animation: floatPill 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (in background) -->
  <circle cx="200" cy="120" r="180" fill="url(#glowGrad1)" class="pulse-orb1" />
  <circle cx="1020" cy="280" r="220" fill="url(#glowGrad2)" class="pulse-orb2" />

  <!-- Grid overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Distributed Network Architecture in Background -->
  <g opacity="0.35">
    <path class="data-flow" d="M 120 80 Q 280 40 450 110 T 780 100 T 1080 60" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="data-flow" d="M 80 340 Q 320 380 600 320 T 920 350 T 1120 300" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <path class="data-flow" d="M 200 360 L 450 110 L 780 100 L 980 340" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <line x1="120" y1="80" x2="200" y2="360" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4" />
    <line x1="780" y1="100" x2="920" y2="350" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="4 4" />
  </g>

  <!-- Network Nodes with Glow -->
  <g>
    <circle cx="120" cy="80" r="6" fill="#38bdf8" class="node-pulse1" />
    <circle cx="450" cy="110" r="6" fill="#818cf8" class="node-pulse2" />
    <circle cx="780" cy="100" r="6" fill="#a855f7" class="node-pulse3" />
    <circle cx="1080" cy="60" r="6" fill="#38bdf8" class="node-pulse1" />
    <circle cx="200" cy="360" r="6" fill="#818cf8" class="node-pulse2" />
    <circle cx="920" cy="350" r="6" fill="#c084fc" class="node-pulse3" />
  </g>

  <!-- Foreground Backdrop Panel for Crisp Readability -->
  <rect x="100" y="55" width="1000" height="295" rx="18" fill="#0b1329" fill-opacity="0.82" stroke="#334155" stroke-width="1" />

  <!-- Category Badge / Pill -->
  <g class="pill-group">
    <rect x="425" y="80" width="350" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="445" cy="95" r="5" fill="#38bdf8" />
    <text x="460" y="100" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM • 2026</text>
  </g>

  <!-- Title (Always in crisp foreground) -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif" font-size="40" font-weight="800" fill="url(#primaryGrad)" filter="url(#glowFilter)" letter-spacing="-0.5">
    Distributed Database &amp; Embedded Storage
  </text>

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    The Definitive Guide to Distributed SQL, Modern NoSQL, Serverless DBs &amp; LSM/B-Tree Engines
  </text>

  <!-- Horizontal Divider -->
  <line x1="250" y1="235" x2="950" y2="235" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Feature Tags / Metric Pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    <!-- Tag 1 -->
    <rect x="170" y="255" width="180" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
    <text x="260" y="275" text-anchor="middle" fill="#38bdf8">⚡ Ultra-Low Latency</text>

    <!-- Tag 2 -->
    <rect x="375" y="255" width="200" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
    <text x="475" y="275" text-anchor="middle" fill="#818cf8">🌐 Global ACID Consensus</text>

    <!-- Tag 3 -->
    <rect x="600" y="255" width="190" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
    <text x="695" y="275" text-anchor="middle" fill="#c084fc">📦 In-Process Persistence</text>

    <!-- Tag 4 -->
    <rect x="815" y="255" width="215" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
    <text x="922" y="275" text-anchor="middle" fill="#34d399">🚀 Serverless Scale-to-Zero</text>
  </g>

  <!-- Footer Tagline -->
  <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">
    Curated for Backend Engineers, Systems Architects, Database Kernel Developers &amp; DevOps Teams
  </text>
</svg>
